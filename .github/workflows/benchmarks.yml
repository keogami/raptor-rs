name: Benchmarks

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/benchmarks

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Benchmark main (baseline)
        run: cargo bench -p raptor --features internal --bench raptor -- --save-baseline main

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Benchmark PR vs main
        run: cargo bench -p raptor --features internal --bench raptor -- --baseline main 2> bench-output.txt

      - name: Post benchmark comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## Benchmark results

          \`\`\`
          $(cat bench-output.txt)
          \`\`\`"

          gh pr comment ${{ github.event.number }} --body "$BODY" --edit-last || \
          gh pr comment ${{ github.event.number }} --body "$BODY"
